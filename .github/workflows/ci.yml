name: Knightfall quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      # Browser UI tests without external credentials; online integration tests require
      # a dedicated ephemeral Neon database, never the production database.
      - run: npx playwright test e2e/chess.spec.ts --grep-invert "online:"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            artifacts/screenshots